/div><span class="session-open" aria-hidden="true">›</span></div></button>`).join('')}</div>`:`<div class="session-empty"><h3>No sessions recorded</h3><p class="muted">Add a talk or workshop as you attend it, then attach photos, notes or recordings.</p></div>`}</section>`;$('backupEvent').onclick=()=>exportPackage('backup',eventId);$('aiEvent').onclick=()=>exportPackage('ai',eventId,$('photoQuality').value);$('allEvents').onclick=renderEvents;$('newSession').onclick=renderNew;$('deleteEvent').onclick=async()=>{if(!canDelete())return;const count=sessions.length;if(!confirm(`Delete conference "${e.title}" and all ${count} session${count===1?'':'s'}, including their notes, photos, recordings and uploads? This cannot be undone.`))return;await deleteEventData(e.id);renderEvents()};app.querySelectorAll('[data-session]').forEach(el=>el.onclick=()=>renderSession(el.dataset.session));}

async function startRecording(){if(recorder&&recorder.state==='recording')return;const area=$('recordArea');area.classList.remove('hidden');area.className='rec';try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microphone recording is not supported in this browser. Use Voice Memos and Upload.');stream=await navigator.mediaDevices.getUserMedia({audio:true});const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];recordStart=Date.now();const sessionId=current;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{clearInterval(recordTicker);stream?.getTracks().forEach(t=>t.stop());stream=null;area.innerHTML='<p class="muted">Saving recording…</p>';if(chunks.length){const mime=recorder.mimeType||'audio/webm';const blob=new Blob(chunks,{type:mime}),suffix=mime.includes('mp4')?'m4a':'webm';try{await put('assets',{id:uuid(),sessionId,name:`Voice note ${new Date(recordStart).toLocaleString('en-AU').replaceAll('/','-').replaceAll(':','-')}.${suffix}`,created:recordStart,file:blob});if(current===sessionId)await renderSession(sessionId)}catch(e){alert('Failed to store the recording: '+e.message)}}};recorder.start(1000);area.innerHTML=`<div class="row between"><b><span class="dot"></span>Recording <span id="elapsed">0:00</span></b><button id="stopRec" class="primary">Stop & save</button></div><p class="small">Keep this page open and your iPhone awake. For full talks, record with Apple Voice Memos instead.</p>`;$('stopRec').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};recordTicker=setInterval(()=>{const s=Math.floor((Date.now()-recordStart)/1000);$('elapsed')&&($('elapsed').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`)},1000)}catch(e){stream?.getTracks().forEach(t=>t.stop());area.innerHTML=`<p class="small">Microphone unavailable: ${enc(e.message)}. R // Dependency-free ZIP (uncompressed), including notes and the original media files.
const encoder=new TextEncoder();function crc32(data){let crc=-1;for(let i=0;i<data.length;i++){crc^=data[i];for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}

async function zip(entries){const pieces=[],central=[];let offset=0;for(const [name,blob] of entries){let nameBytes=encoder.encode(name),bytes=new Uint8Array(await blob.arrayBuffer()),crc=crc32(bytes);if(bytes.length>0xffffffff||offset>0xffffffff)throw Error('Backup is too large for ZIP format');const h=new Uint8Array(30+nameBytes.length),v=new DataView(h.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x800);u32(v,14,crc);u32(v,18,bytes.length);u32(v,22,bytes.length);u16(v,26,nameBytes.length);h.set(nameBytes,30);pieces.push(h,bytes);let c=new Uint8Array(46+nameBytes.length),w=new DataView(c.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u16(w,8,0x800);u32(w,16,crc);u32(w,20,bytes.length);u32(w,24,bytes.length);u16(w,28,nameBytes.length);u32(w,42,offset);c.set(nameBytes,46);central.push(c);offset+=h.length+bytes.length}const centralSize=central.reduce((n,c)=>n+c.length,0);if(entries.length>65535||offset+centralSize>0xffffffff)throw Error('Backup is too large');const end=new Uint8Array(22),e=new DataView(end.buffer);u32(e,0,0x06054b50);u16(e,8,entries.length);u16(e,10,entries.length);u32(e,12,centralSize);u32(e,16,offset);return new Blob([...pieces,...central,end],{type:'application/zip'})}
// V7 packages are uncompressed ZIPs. This makes them self-contained without an external library.
const safeName=s=>String(s||'untitled').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/^\.+$/,'_').slice(0,80);
const jsonBlob=data=>new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const textBlob=s=>new Blob([s],{type:'text/plain;charset=utf-8'});
function mimeExtension(f){const name=f.name||'';return name.includes('.')?name.slice(name.lastIndexOf('.')):({'image/jpeg':'.jpg','image/png':'.png','audio/mp4':'.m4a','audio/webm':'.webm'}[f.type]||'.bin')}
async function optimizePhoto(file,mode){
  if(mode==='original'||!file.type.startsWith('image/')||file.type==='image/svg+xml')return {file,name:null};
  try{
    const bitmap=await createImageBitmap(file),limit=mode==='compact'?1600:2560;
    if(Math.max(bitmap.width,bitmap.height)<=limit&&file.type==='image/jpeg'){bitmap.close();return {file,name:null}}
    const scale=Math.min(1,limit/Math.max(bitmap.width,bitmap.height));
    const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',mode==='compact'?0.75:0.85));
    if(!blob)return {file,name:null};return {file:blob,name:'.jpg'};
  }catch{return {file,name:null}} // e.g. unsupported HEIC; keep the original
}
async function exportPackage(mode,eventId=null,quality='original'){
  if(!canDelete())return;
  const button=eventId?$(mode==='ai'?'aiEvent':'backupEvent'):$('export');
  const label=button.textContent;button.disabled=true;button.textContent='Preparing ZIP…';
  try{
    const events=(await all('events')).filter(e=>!eventId||e.id===eventId);
    const ids=new Set(events.map(e=>e.id));const sessions=(await all('sessions')).filter(s=>ids.has(s.eventId));
    const sessionIds=new Set(sessions.map(s=>s.id));const assets=(await all('assets')).filter(a=>sessionIds.has(a.sessionId));
    const entries=[],records=[];
    const eventPaths=new Map();
    for(const [index,e] of events.entries()){
      const root=`${String(index+1).padStart(2,'0')}_${safeName(e.title)}_${e.id.slice(0,8)}/`;
      eventPaths.set(e.id,root);
      entries.push([root+'conference.json',jsonBlob(e)]);
      const ss=sessions.filter(s=>s.eventId===e.id).sort((a,b)=>a.created-b.created);
      for(const [i,s] of ss.entries()){
        const folder=root+`sessions/${String(i+1).padStart(2,'0')}_${safeName(s.title)}_${s.id.slice(0,8)}/`;
        entries.push([folder+'session.json',jsonBlob(s)]);
        entries.push([folder+'notes.md',textBlob(`# ${s.title}\n\nSpeaker: ${s.speaker||'Not recorded'}\nRoom: ${s.location||'Not recorded'}\n\n${s.notes||''}\n`)]);
        for(const a of assets.filter(a=>a.sessionId===s.id)){
          const kind=a.file.type.startsWith('image/')?'photos':a.file.type.startsWith('audio/')?'recordings':'uploads';
          let file=a.file,filename=`${a.id.slice(0,8)}_${safeName(a.name)}`;
          if(mode==='ai'&&kind==='photos'){
            const optimized=await optimizePhoto(a.file,quality);file=optimized.file;
            if(optimized.name)filename=filename.replace(/\.[^.]+$/,'')+optimized.name;
          }
          const path=folder+kind+'/'+filename;
          entries.push([path,file]);
          records.push({id:a.id,sessionId:a.sessionId,name:a.name,created:a.created,path,type:a.file.type,originalSize:a.file.size,exportedSize:file.size});
        }
      }
    }
    if(mode==='backup'){
      entries.push(['backup.json',jsonBlob({format:'conferenceai-backup',version:7,created:new Date().toISOString(),events,sessions,assets:records})]);
    }else{
      entries.push(['manifest.json',jsonBlob({format:'conferenceai-ai-export',version:7,created:new Date().toISOString(),photoQuality:quality,events,sessions,assets:records})]);
      entries.push(['README.md',textBlob('ConferenceAI AI export. Each session folder contains notes.md, session.json and its photos, recordings and uploads. Please analyse the source materials and separate recorded facts from recommendations. Audio may require transcription before analysis.\n')]);
    }
    const filename=(eventId?safeName(events[0].title):'ConferenceAI-all')+'-'+(mode==='ai'?'AI-export':'backup')+'-'+new Date().toISOString().slice(0,10)+'.zip';
    download(await zip(entries),filename);
  }catch(e){alert('Export failed: '+e.message)}finally{button.disabled=false;button.textContent=label}
}
// Read only the stored-entry ZIP format produced by ConferenceAI v7; reject other formats.
async function parseBackup(file){
  const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer),decoder=new TextDecoder(),files=new Map();let pos=0;
  while(pos+4<=bytes.length&&view.getUint32(pos,true)===0x04034b50){
    if(pos+30>bytes.length)throw Error('Truncated ZIP entry');
    const flags=view.getUint16(pos+6,true),method=view.getUint16(pos+8,true),crc=view.getUint32(pos+14,true),size=view.getUint32(pos+18,true),nameLength=view.getUint16(pos+26,true),extra=view.getUint16(pos+28,true);
    if(method!==0||flags&8)throw Error('Only ZIP backups created by ConferenceAI v7 can be restored');
    const start=pos+30+nameLength+extra,end=start+size;
    if(end>bytes.length)throw Error('Truncated ZIP data');
    const name=decoder.decode(bytes.subarray(pos+30,pos+30+nameLength));
    const data=bytes.subarray(start,end);
    if(crc32(data)!==crc||files.has(name))throw Error('ZIP file failed integrity checks');
    files.set(name,new Blob([data]));pos=end;
  }
  const b=files.get('backup.json');if(!b)throw Error('This ZIP has no v7 backup.json. AI exports and older ZIPs cannot be restored.');
  const manifest=JSON.parse(await b.text());
  if(manifest.format!=='conferenceai-backup'||manifest.version!==7||!Array.isArray(manifest.events)||!Array.isArray(manifest.sessions)||!Array.isArray(manifest.assets))throw Error('Unsupported backup manifest');
  const eventIds=new Set(manifest.events.map(e=>e.id)),sessionIds=new Set(manifest.sessions.map(s=>s.id));
  if(eventIds.size!==manifest.events.length||sessionIds.size!==manifest.sessions.length)throw Error('Duplicate IDs in backup');
  if(manifest.sessions.some(s=>!eventIds.has(s.eventId))||manifest.assets.some(a=>!sessionIds.has(a.sessionId)||!files.has(a.path)))throw Error('Missing or mismatched backup entries');
  return {manifest,files};
}
$('export').onclick=()=>exportPackage('backup');

$('restoreInput').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
